<!DOCTYPE html>
<html lang="$lang$">
<head>
<meta charset="utf-8"/>
<title>$title$</title>
$for(css)$
<link rel="stylesheet" href="$css$"/>
$endfor$
</head>
<body>
<header id="title-block-header">
<h1 class="title">$title$</h1>
<p class="subtitle">$subtitle$</p>
$for(author)$
<p class="author">$author$</p>
$endfor$
</header>
$if(abstract)$
<section class="abstract">
<h1 class="unnumbered">$abstract-title$</h1>
$abstract$
</section>
$endif$
$body$
</body>
</html>
